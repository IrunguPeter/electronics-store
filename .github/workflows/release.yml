name: build-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build app executable
        run: python -m PyInstaller electronstore.spec --noconfirm

      - name: Build online installer
        run: python -m PyInstaller electronstore-setup.spec --noconfirm

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" `
            dist/ElectronStore.exe `
            dist/ElectronStoreSetup.exe `
            --title "ElectronStore $GITHUB_REF_NAME" `
            --generate-notes